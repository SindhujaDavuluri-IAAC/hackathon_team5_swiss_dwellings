<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Swiss Dwellings</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-card"><div class="eyebrow">SWISS DWELLINGS</div><h1 id="auth-title">Welcome back.</h1><p id="auth-copy">Log in to explore apartment profiles and compare twins.</p><form id="login-form"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><p id="password-rules" class="small muted" hidden>At least 8 characters, including an uppercase letter, a lowercase letter, a number and a special character.</p><button class="primary full" id="login-button" type="submit">Log in</button><p id="login-error" class="login-error" role="alert"></p></form><p class="small muted">New here? <button id="toggle-auth" class="text-button" type="button">Create an account</button></p></main></body></html>
